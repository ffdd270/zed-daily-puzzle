name = "GDScript"
grammar = "gdscript"
path_suffixes = ["gd"]
line_comments = ["# "]
hard_tabs = true
tab_size = 4
increase_indent_pattern = ":\\s*$"
autoclose_before = ":.,}])"
brackets = [
    { start = "(", end = ")", close = true, newline = true },
    { start = "[", end = "]", close = true, newline = true },
    { start = "{", end = "}", close = true, newline = true },
    { start = '"', end = '"', close = true, newline = false },
    { start = "'", end = "'", close = true, newline = false },
]
